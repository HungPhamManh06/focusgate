name: FocusGate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-and-db:
    name: Web & Database (PGlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run verify:all
      - run: npm run web:build
      - name: Check browser extension scripts
        run: |
          node --check apps/browser-extension/background.js
          node --check apps/browser-extension/popup.js
          node --check apps/browser-extension/blocked.js

  windows-agent:
    name: Windows Agent (.NET 10)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test apps/windows-agent/FocusGate.Agent.slnx

  android:
    name: Android Unit Tests (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Decode persistent Android keystore (if configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/focusgate.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/focusgate.jks" >> "$GITHUB_ENV"
          fi
      - name: Run unit tests and build Personal Debug APK
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testPersonalDebugUnitTest testManagedDebugUnitTest assemblePersonalDebug
      - name: Upload Personal Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: focusgate-android-personal-debug
          path: apps/android/app/build/outputs/apk/personal/debug/*.apk
