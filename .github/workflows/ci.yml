name: FocusGate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-and-db:
    name: Web & Database (PGlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run verify:all
      - run: npm run web:build

  windows-agent:
    name: Windows Agent (.NET 10)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test apps/windows-agent/FocusGate.Agent.slnx

  android:
    name: Android Unit Tests (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Run unit tests for personal and managed flavors
        working-directory: apps/android
        run: |
          chmod +x gradlew
          ./gradlew testPersonalDebugUnitTest testManagedDebugUnitTest
