name: FocusGate CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-and-db:
    name: Web & Database (PGlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run verify:all
      - run: npm run web:build
      - name: Check browser extension scripts
        run: |
          node --check apps/browser-extension/background.js
          node --check apps/browser-extension/popup.js
          node --check apps/browser-extension/blocked.js

  windows-agent:
    name: Windows Agent (.NET 10)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test apps/windows-agent/FocusGate.Agent.slnx
      - name: Publish Windows Single-File EXE
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: >
          dotnet publish apps/windows-agent/src/FocusGate.Agent.Poc/FocusGate.Agent.Poc.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=0.1.${{ github.run_number }}
          -o apps/windows-agent/release-out --nologo
      - name: Publish Windows Release EXE (for In-App Self-Updater)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v0.1.${{ github.run_number }}
          name: FocusGate Windows v0.1.${{ github.run_number }}
          body: Automated FocusGate Windows Agent build #${{ github.run_number }}.
          files: apps/windows-agent/release-out/FocusGate.exe

  android:
    name: Android Unit Tests (JDK 17)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Decode persistent Android keystore (if configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/focusgate.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/focusgate.jks" >> "$GITHUB_ENV"
          fi
      - name: Run unit tests and build Personal Debug APK
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testPersonalDebugUnitTest testManagedDebugUnitTest assemblePersonalDebug
      - name: Upload Personal Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: focusgate-android-personal-debug
          path: apps/android/app/build/outputs/apk/personal/debug/*.apk
      - name: Publish Android Release APK (for In-App Updater)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v0.1.${{ github.run_number }}
          name: FocusGate Android v0.1.${{ github.run_number }}
          body: Automated persistent-signed Android build #${{ github.run_number }}.
          files: apps/android/app/build/outputs/apk/personal/debug/*.apk
          make_latest: true
