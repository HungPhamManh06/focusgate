<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FocusGate Blocker</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      width: 336px;
      margin: 0;
      padding: 16px;
      background: linear-gradient(160deg, #161012 0%, #100b0c 60%, #1d1113 100%);
      color: #f5eeee;
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .brand-row img {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      flex-shrink: 0;
      box-shadow: 0 4px 14px rgba(185, 28, 28, 0.35);
    }
    h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin: 0 0 2px 0;
      color: #ffffff;
    }
    p.sub {
      font-size: 11.5px;
      color: #b4a3a6;
      margin: 0;
    }
    .card {
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 232, 235, 0.12);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
      backdrop-filter: blur(12px);
    }
    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      margin: 10px 0 4px 0;
      color: #c8b8bb;
    }
    input {
      width: 100%;
      padding: 9px 11px;
      border: 1px solid rgba(255, 232, 235, 0.16);
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.35);
      color: #ffffff;
      font-size: 12.5px;
      outline: none;
    }
    input:focus {
      border-color: #f87171;
    }
    button {
      width: 100%;
      padding: 10px 14px;
      border: 0;
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: transform 0.12s ease, opacity 0.15s ease, background 0.15s ease;
    }
    button:active {
      transform: scale(0.98);
    }
    .primary {
      background: linear-gradient(135deg, #b91c1c, #dc2626);
      color: #ffffff;
      box-shadow: 0 6px 18px rgba(185, 28, 28, 0.35);
    }
    .primary:hover {
      opacity: 0.94;
    }
    .secondary {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 232, 235, 0.12);
      color: #f1e7e8;
    }
    .secondary:hover {
      background: rgba(255, 255, 255, 0.12);
    }
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 10px;
    }
    .locked {
      background: rgba(248, 113, 113, 0.16);
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: #fca5a5;
    }
    .unlocked {
      background: rgba(52, 211, 153, 0.16);
      border: 1px solid rgba(52, 211, 153, 0.35);
      color: #6ee7b7;
    }
    .error {
      color: #fca5a5;
      font-size: 11.5px;
      margin-top: 6px;
    }
    .meta {
      font-size: 12px;
      color: #cbbabd;
      margin: 5px 0;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="brand-row">
    <img src="icons/icon.svg" alt="FocusGate" />
    <div>
      <h1 id="title">FocusGate 8.0</h1>
      <p class="sub" id="subtitle">Syncs with your daily Must-Do plan.</p>
    </div>
  </div>

  <div id="signedOutView" class="card" style="display: none;">
    <form id="loginForm">
      <label for="emailInput">Email</label>
      <input id="emailInput" type="email" required placeholder="you@example.com" />
      <label for="passwordInput" id="passwordLabel">Password</label>
      <input id="passwordInput" type="password" required />
      <button type="submit" class="primary" id="signInBtn">Sign in &amp; Sync</button>
    </form>
    <div id="loginError" class="error"></div>
  </div>

  <div id="signedInView" style="display: none;">
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;">
        <span id="statusBadge" class="status-pill locked" style="margin-bottom:0;">Lock Active</span>
        <svg width="34" height="34" viewBox="0 0 36 36" aria-label="Focus progress">
          <circle cx="18" cy="18" r="15" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3" />
          <circle id="ringArc" cx="18" cy="18" r="15" fill="none" stroke="#f87171" stroke-width="3" stroke-linecap="round" stroke-dasharray="94.2" stroke-dashoffset="32" transform="rotate(-90 18 18)" />
        </svg>
      </div>
      <div class="meta" id="shieldLabel" style="color:#fca5a5;font-weight:600;"></div>
      <div class="meta" id="emailLabel"></div>
      <div class="meta" id="domainsLabel"></div>
      <div class="meta" id="earnedLabel"></div>
      <div id="syncError" class="error"></div>
    </div>
    <button class="primary" id="syncBtn">Sync Now</button>
    <button class="secondary" id="focusBtn">Open Focus Studio</button>
    <button class="secondary" id="breakBtn">5m Quick Break</button>
    <button class="secondary" id="ytStudyBtn">YouTube Study Mode: OFF</button>
    <button class="secondary" id="passBtn">Use 10m Earned Time Pass</button>
    <button class="secondary" id="openWebBtn">Open FocusGate Web</button>
    <button class="secondary" id="signOutBtn">Sign out</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
