<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FocusGate – Locked</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top right, #2b1317 0%, #120b0d 55%, #0a0708 100%);
      color: #f5eeee;
      font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
      padding: 24px;
    }
    .panel {
      max-width: 540px;
      width: 100%;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 232, 235, 0.14);
      border-radius: 24px;
      padding: 36px;
      backdrop-filter: blur(18px);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
    }
    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #f87171;
      font-weight: 700;
    }
    .brand img {
      width: 30px;
      height: 30px;
      border-radius: 9px;
    }
    .breath-dot {
      width: 14px;
      height: 14px;
      border-radius: 999px;
      background: #f87171;
      box-shadow: 0 0 0 8px rgba(248, 113, 113, 0.18);
      animation: fgBreath 8s ease-in-out infinite;
    }
    @keyframes fgBreath {
      0%, 100% { transform: scale(0.85); opacity: 0.7; }
      50% { transform: scale(1.25); opacity: 1; }
    }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 30px;
      margin: 0 0 12px 0;
      line-height: 1.22;
      color: #ffffff;
    }
    p {
      font-size: 14.5px;
      line-height: 1.6;
      color: #c8b8bb;
      margin: 0 0 18px 0;
    }
    .mantra {
      font-size: 12.5px;
      font-style: italic;
      color: #a39296;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 232, 235, 0.08);
      margin-bottom: 24px;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    button {
      padding: 12px 20px;
      border-radius: 999px;
      border: 0;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, opacity 0.15s ease;
    }
    button:active { transform: scale(0.98); }
    .primary {
      background: linear-gradient(135deg, #b91c1c, #dc2626);
      color: #ffffff;
      box-shadow: 0 8px 22px rgba(185, 28, 28, 0.4);
    }
    .secondary {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 232, 235, 0.14);
      color: #f5eeee;
    }
    .error {
      color: #fca5a5;
      font-size: 13px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <div class="panel">
    <div class="brand-row">
      <div class="brand">
        <img src="icons/icon.svg" alt="FocusGate" />
        <span>FOCUSGATE 5.0</span>
      </div>
      <div class="breath-dot" title="4-4-4 Breathing Cue"></div>
    </div>
    <h1 id="headline">Site blocked during focus lock</h1>
    <p id="message">Finish your Must-Do tasks and verified focus sessions to unlock entertainment sites.</p>
    <div class="mantra">“Discipline is choosing what you want most over what you want now.”</div>
    <div class="actions">
      <button class="primary" id="plannerBtn">Open FocusGate Planner</button>
      <button class="secondary" id="passBtn" style="display: none;">Use 10m Earned Time Pass</button>
    </div>
    <div id="errorBox" class="error"></div>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
