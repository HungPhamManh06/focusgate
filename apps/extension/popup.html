<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>FocusGate</title>
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 16px;
        font-family: system-ui, -apple-system, sans-serif;
        background: #0f1115;
        color: #f4f4f6;
      }
      h1 {
        font-size: 16px;
        margin: 0 0 4px;
      }
      p {
        font-size: 12px;
        color: #9ca3af;
        margin: 0 0 12px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        margin-bottom: 8px;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid #272b36;
        background: #181b22;
        color: #fff;
      }
      button {
        width: 100%;
        padding: 9px 12px;
        border-radius: 8px;
        border: none;
        background: #4f7cff;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 6px;
      }
      button.secondary {
        background: #232733;
      }
      .status {
        padding: 10px;
        border-radius: 10px;
        background: #181b22;
        margin-bottom: 10px;
        font-size: 12px;
      }
      .error {
        color: #f87171;
        font-size: 12px;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <h1>FocusGate</h1>
    <p>Finish your tasks. Earn your freedom.</p>

    <div id="auth-view" style="display: none">
      <input id="email" type="email" placeholder="Supabase email" />
      <input id="password" type="password" placeholder="Password" />
      <button id="sign-in-btn">Sign in &amp; Connect</button>
    </div>

    <div id="main-view" style="display: none">
      <div class="status" id="status-box">Loading...</div>
      <button id="sync-btn">Sync Now</button>
      <button id="unlock-btn" class="secondary">Use 10m Earned Time Pass</button>
      <button id="open-web-btn" class="secondary">Open FocusGate Web</button>
      <button id="sign-out-btn" class="secondary">Sign out</button>
    </div>

    <div id="error-box" class="error"></div>
    <script src="popup.js"></script>
  </body>
</html>
